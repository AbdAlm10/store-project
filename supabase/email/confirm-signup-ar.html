<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <body style="margin:0;background:#f7f4ef;font-family:Tahoma,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f4ef;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:24px;padding:32px 28px;">
            <tr>
              <td align="center" style="font-size:22px;font-weight:700;color:#1f2933;">دكّان</td>
            </tr>
            <tr>
              <td align="right" style="padding-top:20px;font-size:16px;line-height:1.8;color:#334155;">
                أهلًا بك. استخدم رمز التأكيد التالي لإكمال إنشاء حسابك في دكّان:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 0;">
                <div style="display:inline-block;direction:ltr;letter-spacing:8px;font-size:32px;font-weight:700;color:#145c3a;background:#eef8f2;border-radius:16px;padding:14px 22px;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td align="right" style="font-size:14px;line-height:1.8;color:#64748b;">
                صلاحية الرمز محدودة. إذا انتهى، اطلب رمزًا جديدًا من صفحة التأكيد. إذا لم تطلب إنشاء حساب، يمكنك تجاهل هذه الرسالة.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
